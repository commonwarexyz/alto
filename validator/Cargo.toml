[package]
name = "alto-validator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run a validator node for alto."

[dependencies]
alto-chain = { workspace = true }
alto-client = { workspace = true }
alto-types = { workspace = true }
commonware-codec = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-deployer = { workspace = true }
commonware-formatting = { workspace = true }
commonware-p2p = { workspace = true }
commonware-parallel = { workspace = true }
commonware-runtime = { workspace = true }
commonware-stream = { workspace = true }
commonware-utils = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
clap = { workspace = true }
mimalloc = { workspace = true }
tracing = { workspace = true }
serde_yaml = "0.9.34"

[features]
# Post-quantum mode: ML-DSA-65 identities and certificates with ML-KEM-768 transport handshakes.
pq = ["alto-types/pq", "alto-chain/pq", "alto-client/pq"]

[[bin]]
name = "validator"
path = "src/main.rs"
