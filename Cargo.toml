[workspace]
members = [
    "chain",
    "client",
    "follower",
    "deploy",
    "inspector",
    "indexer",
    "types",
    "validator",
]
resolver = "2"

[workspace.package]
version = "2026.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alto-chain = { version = "2026.9.1", path = "chain" }
