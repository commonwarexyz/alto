# Example configuration for the alto follower node
#
# This configuration connects to an indexer running on this machine
# and stores finalized blocks locally.

# URL of the indexer endpoint
source: "http://localhost:8080"

# Hex-encoded participant set of the network (the ordered ellipsoidal Falcon-512 public keys of its
# validators), used to verify every certificate signature. Copy the `identity` field of the
# network's indexer configuration.
identity: "<hex-encoded participant set>"

# Set to the network's configured block payload size in bytes.
block_size: 0

# Directory for storing finalized blocks and state
directory: "/tmp/alto-follower"

# Number of worker threads
worker_threads: 2

# Number of threads for signature verification
signature_threads: 4

# Log level (trace, debug, info, warn, error)
log_level: "info"

# Port for Prometheus metrics endpoint
metrics_port: 9091

# Size of internal mailboxes
mailbox_size: 4096

# Maximum number of blocks to fetch concurrently during backfill
max_repair: 512

# Milliseconds between retries for failed backfill requests
fetch_retry_timeout_ms: 5000

# Start from the tip of the finalized chain on first run
# Set to false to start from genesis (requires backfilling all historical blocks)
tip: false

# Number of finalized blocks to retain before pruning
# Omit or set to null to keep all blocks (no pruning)
pruning_depth: null
